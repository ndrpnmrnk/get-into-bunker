<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Into Bunker — проба стиля</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #BFE3F0; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    .panel { position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 70vw; }
    .panel button { border: 2px solid #3B3340; background: #FFF8EE; color: #3B3340; border-radius: 10px;
      padding: 6px 12px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
    .panel button:hover { background: #F6D98B; }
    .status { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: #FFF8EEdd;
      color: #3B3340; border: 2px solid #3B3340; border-radius: 10px; padding: 6px 14px; font: 500 14px system-ui, sans-serif; }
    .status[hidden] { display: none; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
