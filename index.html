<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title></title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); font-family: system-ui, sans-serif; }
    canvas { display: block; }
    .panel { position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 70vw; }
    .panel button { border: 2px solid var(--ui-ink); background: var(--ui-bg); color: var(--ui-ink); border-radius: 10px;
      padding: 6px 12px; font: 600 14px system-ui, sans-serif; cursor: pointer; }
    .panel button:hover { background: var(--ui-accent); }
    .status { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--ui-bg);
      color: var(--ui-ink); border: 2px solid var(--ui-ink); border-radius: 10px; padding: 6px 14px; font: 500 14px system-ui, sans-serif; }
    .status[hidden] { display: none; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
